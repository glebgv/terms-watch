name: Deploy Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'data/**', 'changelog.json', 'feed.xml', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir -p _stage
          cp -r site/* _stage/
          touch _stage/.nojekyll
          # данные и фиды доступны по корневым путям: /data/..., /changelog.json, /feed.xml
          cp -r data _stage/data
          cp changelog.json _stage/ 2>/dev/null || echo '{"updated":null,"entries":[]}' > _stage/changelog.json
          cp feed.xml _stage/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _stage
      - id: deployment
        uses: actions/deploy-pages@v4
