<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeadHunter — Terms Watch</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7/dist/fuse.min.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="site" data-site="hh" class="bg-gray-950 text-gray-100 min-h-screen">
<header class="border-b border-gray-800">
  <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
    <a href="/" class="text-xl font-bold">⚖️ Terms Watch</a>
    <a href="/" class="text-sm hover:underline">← все сайты</a>
  </div>
</header>
<main class="max-w-5xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold mb-2">HeadHunter</h1>
  <div id="meta" class="mb-2 text-gray-300"></div>
  <div id="docmeta" class="space-y-1 mb-8"></div>

  <section class="mb-8 bg-gray-900 border border-gray-800 rounded-lg p-4">
    <h2 class="font-semibold mb-3">Сравнить две версии</h2>
    <div class="flex flex-wrap gap-2 items-center">
      <select id="cmp-doc" class="bg-gray-800 border border-gray-700 rounded px-2 py-1"></select>
      <input id="cmp-1" type="date" class="bg-gray-800 border border-gray-700 rounded px-2 py-1">
      <span class="text-gray-500">→</span>
      <input id="cmp-2" type="date" class="bg-gray-800 border border-gray-700 rounded px-2 py-1">
      <button id="btn-compare" class="px-3 py-1 bg-blue-700 hover:bg-blue-600 rounded">Сравнить</button>
    </div>
  </section>

  <h2 class="font-semibold mb-4">Таймлайн изменений</h2>
  <div id="timeline" class="space-y-4"></div>
</main>
<footer class="border-t border-gray-800 mt-12"><div class="max-w-5xl mx-auto px-4 py-6 text-sm text-gray-400">
  Диффы публикуются как цитирование в информационных целях (ст. 1274 ГК РФ). Правообладатель может запросить удаление фрагмента.
</div></footer>
<script src="/app.js"></script>
</body>
</html>
